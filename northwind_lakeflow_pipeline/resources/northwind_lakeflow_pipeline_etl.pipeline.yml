# The main pipeline for northwind_lakeflow_pipeline
resources:
  pipelines:
    northwind_lakeflow_pipeline_etl:
      name: ${bundle.target}_dlt_pipeline

      tags:
        env: ${bundle.target}

      serverless: true

      #root_path: "../src/northwind_lakeflow_pipeline_etl"
      #libraries:

      libraries:
        # - file:
        #   path: ../src/northwind_lakeflow_pipeline_etl/transformations/*.py
        - glob:
            include: ../src/northwind_lakeflow_pipeline_etl/transformations/**

      configuration:
        catalog_name: ${var.target_catalog}
        raw_catalog_name: ${var.prod_catalog_name}
        raw_schema_name: ${var.raw_schema}
        stg_schema_name: ${var.stg_schema}
        int_schema_name: ${var.int_schema}
        mart_schema_name: ${var.mart_schema}
        bundle.sourcePath: "${workspace.file_path}/src"

      catalog: ${var.target_catalog}
      schema: ${var.dev_schema_name}
      # schema_silver: silver_de #${var.schema_silver}

