# This is a Databricks asset bundle definition for northwind_lakeflow_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: northwind_lakeflow_pipeline
  uuid: 09ef711b-9837-4ffa-8639-9483b7ba06fc

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-770f780f-8566.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-770f780f-8566.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thaina.moraes@indicium.tech to make sure we only have a single copy.
      root_path: /Workspace/Users/thaina.moraes@indicium.tech/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: thaina.moraes@indicium.tech
        level: CAN_MANAGE
