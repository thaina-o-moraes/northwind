targets:
  dev:
    mode: development
    default: true
    variables:
      target_catalog: ${var.dev_catalog_name}
      raw_schema: bronze
      stg_schema: silver_${var.dev_schema_name}
      int_schema: intermediate_${var.dev_schema_name}
      mart_schema: gold_${var.dev_schema_name}

    workspace:
      host: https://dbc-770f780f-8566.cloud.databricks.com
      # root_path: /Workspace/Users/{workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    
