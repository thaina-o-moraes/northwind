targets:
  dev:
    mode: development
    default: true
    variables:
      target_catalog: ${var.dev_catalog_name}
      raw_schema: ${var.dev_schema_name}_bronze
      stg_schema: ${var.dev_schema_name}_silver
      int_schema: ${var.dev_schema_name}_intermediate
      mart_schema: ${var.dev_schema_name}_gold

    workspace:
      host: https://dbc-770f780f-8566.cloud.databricks.com
      root_path: /Workspace/Users/{workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    
